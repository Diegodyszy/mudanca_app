<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Empresa</title>
  <link rel="stylesheet" href="../paginicial/paginicial.css">
  <link rel="stylesheet" href="relacao.css">
  <script src="relacao.js" defer></script>
</head>
<body>
  <header class="main-header">
    <div class="header-container">
        <img src="imgs/logo.png" alt="Logo Mudança Fácil" class="logo">
        <nav class="nav-menu">         
            <a href="../paginicial/paginicial.html">Início</a>
        </nav>
    </div>
  </header>

  <h1>Envie a relação dos seus móveis</h1>

  <form id="formCadastro">
    <div class="form-group">
      <label for="nome">Nome :</label>
      <input type="text" id="nome" name="nome" required>
    </div>

    <div class="form-group">
      <label for="telefone">Número de telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
    </div>

    <div class="form-group">
      <label for="endereco">Endereço da mudança:</label>
      <input type="text" id="endereco" name="endereco" required>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    </div>

    <button type="submit">Finalizar Relação</button>
  </form>

</body>
</html>
