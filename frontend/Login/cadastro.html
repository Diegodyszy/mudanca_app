<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Empresa</title>
  <link rel="stylesheet" href="cadastro.css">
  <script src="cadastro.js" defer></script>
</head>
<body>
  <header>
    <img class="logo" src="/frontend/Login/imgs/logo.png">
    <nav class="nav-header">
        <a href="../Home/home.html" class="nav-link">Página Inicial</a>
        <a href="../Home/servicos.html" class="nav-link">Serviços</a>
        <a href="../Home/sobre.html" class="nav-link">Sobre</a>
        <a href="../Home/dicas.html" class="nav-link">Dicas</a>
        <a href="../Home/fotos.html" class="nav-link">Fotos</a>
        <a href="../Paineladm/paineladm.html" class="nav-link">Painel Adm</a>
    </nav>
  </header>

  <h1>Cadastro</h1>

  <form id="formCadastro">
    <div class="form-group">
      <label for="nome">Nome :</label>
      <input type="text" id="nome" name="nome" required>
    </div>

    <div class="form-group">
      <label for="telefone">Número de telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
    </div>

    <div class="form-group">
      <label for="endereco">Endereço da mudança:</label>
      <input type="text" id="endereco" name="endereco" required>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    </div>

    <button type="submit">Finalizar Relação</button>
  </form>

</body>
</html>
