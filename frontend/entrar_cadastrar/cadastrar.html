<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar - Mudança Fácil</title>
  <link rel="stylesheet" href="../paginicial/paginicial.css">
  <link rel="stylesheet" href="cadastrar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="cadastrar.js" defer></script>
</head>
<body>
  <header class="main-header">
    <div class="header-container">
        <img src="../Login/imgs/logo.png" alt="Logo Mudança Fácil" class="logo">
        <nav class="nav-menu">         
            <a href="../paginicial/paginicial.html">Início</a>
            <div class="auth-buttons">
                <a href="login.html" class="btn-login">Entrar</a>
                <a href="cadastrar.html" class="btn-signup">Cadastrar</a>
            </div>
        </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="card-cadastrar">
      <div class="card-header">
        <h1>Criar Conta</h1>
        <p>Preencha os dados abaixo para começar</p>
      </div>

      <form id="formCadastro">
        <div class="form-group">
          <label for="nome"><i class="fa-solid fa-user"></i> Nome Completo</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="senha"><i class="fa-solid fa-lock"></i> Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required>
        </div>


        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <button type="submit" class="btn-cadastrar">Finalizar Cadastro</button>
      </form>
      
      <div class="card-footer">
        <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Mudança Fácil. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
