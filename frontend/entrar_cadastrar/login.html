<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Mudança Fácil</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="login.js" defer></script>
</head>
<body>
  <header>
    <img class="logo" src="/frontend/Login/imgs/logo.png" alt="Logo Mudança Fácil">
    <nav class="nav-header">

    </nav>
  </header>

  <main class="main-content">
    <div class="card-login">
      <div class="card-header">
        <h1>Acessar Conta</h1>
        <p>Bem-vindo de volta! Faça login para continuar.</p>
      </div>

      <form id="formLogin">
        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="senha"><i class="fa-solid fa-lock"></i> Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
        </div>

        <button type="submit" class="btn-entrar">Entrar</button>
      </form>
      
      <div class="card-footer">
        <p>Ainda não tem uma conta? <a href="cadastrar.html">Cadastre-se</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Mudança Fácil. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
