<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - [Nome do Seu Site]</title>
    <link rel="stylesheet" href="../paginicial/paginicial.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <img src="../Login/imgs/logo.png" alt="Logo Mudança Fácil" class="logo">
            <nav class="nav-menu">         
                <a href="../paginicial/paginicial.html">Início</a>
            </nav>
        </div>
    </header>

    <h1>Bem-vindo ao Mudança Facil!</h1>

    <main class="container-home">
      <h2>Vamos organizar sua mudança!</h2>
      <p>Envie suas informações e faremos o orçamento completo da sua mudança.</p>
      <a class="para_cadastro" href="../Login/relacao.html">
        <button class="btn-enviar">
            <div class="svg-wrapper">
                <i class="fa-regular fa-clipboard"></i>
            </div>

            <div class="texto-btn">
                <span>Enviar minhas informações</span>
                <small>Fazer relação da minha mudança</small>
            </div>

            <i class="fa-solid fa-arrow-right"></i>
        </button>
      </a>

            <div id="painel-admin" style="display:none;">
        <a class="para_cadastro" href="/frontend/Paineladm/painelcadastros.html">
          <button class="btn-enviar">
              <div class="svg-wrapper">
                  <i class="fa-solid fa-users"></i>
              </div>
              <div class="texto-btn">
                  <span>Painel de Cadastros</span>
                  <small>Gerenciar usuários</small>
              </div>
              <i class="fa-solid fa-arrow-right"></i>
          </button>
        </a>

        <a class="para_cadastro" href="/frontend/Paineladm/painelrelacoes.html">
          <button class="btn-enviar">
              <div class="svg-wrapper">
                  <i class="fa-solid fa-clipboard-list"></i>
              </div>
              <div class="texto-btn">
                  <span>Painel de Relações</span>
                  <small>Gerenciar relações</small>
              </div>
              <i class="fa-solid fa-arrow-right"></i>
          </button>
        </a>
      </div>
    </main>

    <footer>
        <p>&copy; 2026 Mudança Fácil. Todos os direitos reservados.</p>
    </footer>

        <script>
        const role = sessionStorage.getItem("role");
        if (role === "ADMIN") {
            document.getElementById("painel-admin").style.display = "block";
        }
    </script>
</body>
</html>
